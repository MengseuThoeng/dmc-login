services:
  test-key-clock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-key-clock
    restart: unless-stopped
    ports:
      - "1001:1001"
    environment:
      - NODE_ENV=production
      - PORT=1001
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1

networks:
  default:
    driver: bridge